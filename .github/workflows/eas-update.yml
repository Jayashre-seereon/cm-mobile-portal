
name: CareerMap OTA Update

on:
  push:
    branches:
      - main

jobs:
  publish-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Publish EAS Update
        run: npx eas-cli@latest update --channel preview --message "Automatic update from main" --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
